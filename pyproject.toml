[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maibot-qq-voice-call"
version = "0.3.4"
description = "MaiBot plugin for low-latency QQ voice calls"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "ClaudiaGardner" }]
dependencies = [
  "aiohttp>=3.10,<4",
  "maibot-plugin-sdk>=2.5.4,<3",
]

[project.optional-dependencies]
windows-audio = [
  "numpy>=2.1,<3",
  "sounddevice==0.5.3",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["maibot_qq_voice_call*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
